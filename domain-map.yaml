# Domain Mapping — InsureCRM
# Maps source code files to documentation pages and OpenAPI specs.
# See .agents/skills/update-domain-mapping/SKILL.md for rules on how to maintain this file.
#
# Last updated: 2026-04-01 (initial seed)

