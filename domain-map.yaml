# ─────────────────────────────────────────────
# OpenAPI Specs
# ─────────────────────────────────────────────
specs:

  - spec: specs/express-openapi.json
    generator: scripts/generate-openapi-specs.sh
    sources:
      - file: javascript/src/routes/auth.ts
        concern: "Auth endpoints — JSDoc @openapi annotations define the spec"
      - file: javascript/src/routes/clients.ts
        concern: "Client endpoints — JSDoc @openapi annotations define the spec"
      - file: javascript/src/types/auth.ts
        concern: "Auth request/response types referenced by OpenAPI schemas"
      - file: javascript/src/types/client.ts
        concern: "Client/Policy types referenced by OpenAPI schemas"

  - spec: specs/springboot-openapi.json
    generator: scripts/generate-openapi-specs.sh
    sources:
      - file: java/src/main/java/com/insurecrm/email/controller/SendEmailController.java
        concern: "Send Email endpoints — @Operation/@ApiResponse Swagger annotations"
      - file: java/src/main/java/com/insurecrm/email/controller/ReceiveEmailController.java
        concern: "Receive Email endpoints — @Operation/@Tag Swagger annotations"
      - file: java/src/main/java/com/insurecrm/email/model/EmailRequest.java
        concern: "EmailRequest DTO — @Schema annotations for request body spec"
      - file: java/src/main/java/com/insurecrm/email/model/EmailResponse.java
        concern: "EmailResponse DTO — @Schema annotations for response spec"
      - file: java/src/main/java/com/insurecrm/email/model/ReceivedEmail.java
        concern: "ReceivedEmail model — @Schema annotations for inbox response spec"

