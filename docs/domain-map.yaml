# Domain Mapping — InsureCRM
# Maps source code files to documentation pages and OpenAPI specs.
# See .agents/skills/update-domain-mapping/SKILL.md for rules on how to maintain this file.
#
# Last updated: 2026-04-01 (initial seed)

# ─────────────────────────────────────────────
# Documentation Pages
# ─────────────────────────────────────────────
pages:

  # ── Index / Homepage ──────────────────────
  # Cross-cutting page: lists all controllers, ports, and concerns.
  # Update when a controller is added, removed, or renamed.

  - doc: docs/docs/index.md
    section: "System at a Glance"
    sources:
      - file: javascript/src/routes/auth.ts
        concern: "Auth controller entry in the system table (base path, port, endpoint count)"
      - file: javascript/src/routes/clients.ts
        concern: "Clients controller entry in the system table (base path, port, endpoint count)"
      - file: java/src/main/java/com/insurecrm/email/controller/SendEmailController.java
        concern: "Send Email controller entry in the system table (base path, port, endpoint count)"
      - file: java/src/main/java/com/insurecrm/email/controller/ReceiveEmailController.java
        concern: "Receive Email controller entry in the system table (base path, port, endpoint count)"

  - doc: docs/docs/index.md
    section: "Authentication Overview"
    sources:
      - file: javascript/src/routes/auth.ts
        concern: "List of public vs authenticated endpoints"
      - file: javascript/src/types/auth.ts
        concern: "JWT token shape and role enum values"

  # ── Product Overview ──────────────────────
  # High-level feature descriptions. Update when a new feature area is added.

  - doc: docs/docs/product.md
    section: "Architecture"
    sources:
      - file: javascript/src/routes/auth.ts
        concern: "Auth controller row in the Core API architecture table"
      - file: javascript/src/routes/clients.ts
        concern: "Clients controller row in the Core API architecture table"
      - file: java/src/main/java/com/insurecrm/email/controller/SendEmailController.java
        concern: "Send Email controller row in the Email Service architecture table"
      - file: java/src/main/java/com/insurecrm/email/controller/ReceiveEmailController.java
        concern: "Receive Email controller row in the Email Service architecture table"

  - doc: docs/docs/product.md
    section: "Authentication & Access Control"
    sources:
      - file: javascript/src/types/auth.ts
        concern: "Role definitions (admin, agent, viewer) and their descriptions"

  # ── Authentication Guide ──────────────────
  # Detailed JWT/RBAC reference page.

  - doc: docs/docs/authentication.md
    section: "Authentication Flow"
    sources:
      - file: javascript/src/routes/auth.ts
        lines: [14, 50]
        concern: "Login endpoint — step 1-3 of the auth flow"
      - file: javascript/src/routes/auth.ts
        lines: [103, 135]
        concern: "Refresh endpoint — step 6-7 of the auth flow"

  - doc: docs/docs/authentication.md
    section: "Token Format"
    sources:
      - file: javascript/src/types/auth.ts
        concern: "AuthTokens interface defines accessToken, refreshToken, expiresIn"

  - doc: docs/docs/authentication.md
    section: "Roles & Permissions"
    sources:
      - file: javascript/src/types/auth.ts
        concern: "RegisterRequest.role enum defines available roles"

  - doc: docs/docs/authentication.md
    section: "Error Responses"
    sources:
      - file: javascript/src/routes/auth.ts
        concern: "Error codes returned by auth endpoints (401, 423, 409, 400)"

  # ── Core API (OAD-rendered from OpenAPI spec) ───────────────────
  # This page uses the neoteroi OAD plugin — endpoint details are auto-generated
  # from docs/docs/specs/express-openapi.json. The agent updates source code
  # annotations (JSDoc @openapi blocks), not the markdown page itself.

  - doc: docs/docs/api/core-api.md
    section: "API Reference (OAD-rendered)"
    sources:
      - file: javascript/src/routes/auth.ts
        concern: "Auth endpoints — JSDoc @openapi annotations drive the spec"
      - file: javascript/src/routes/clients.ts
        concern: "Client endpoints — JSDoc @openapi annotations drive the spec"
      - file: javascript/src/routes/coi.ts
        concern: "COI endpoints — JSDoc @openapi annotations drive the spec"
      - file: javascript/src/types/auth.ts
        concern: "Auth request/response types referenced by OpenAPI schemas"
      - file: javascript/src/types/client.ts
        concern: "Client/Policy types referenced by OpenAPI schemas"
      - file: javascript/src/types/coi.ts
        concern: "COI types referenced by OpenAPI schemas"

  # ── Email API (OAD-rendered from OpenAPI spec) ─────────────────
  # This page uses the neoteroi OAD plugin — endpoint details are auto-generated
  # from docs/docs/specs/springboot-openapi.json. The agent updates source code
  # annotations (@Operation/@Schema), not the markdown page itself.

  - doc: docs/docs/api/email-api.md
    section: "API Reference (OAD-rendered)"
    sources:
      - file: java/src/main/java/com/insurecrm/email/controller/SendEmailController.java
        concern: "Send Email endpoints — @Operation/@ApiResponse annotations drive the spec"
      - file: java/src/main/java/com/insurecrm/email/controller/ReceiveEmailController.java
        concern: "Receive Email endpoints — @Operation/@Tag annotations drive the spec"
      - file: java/src/main/java/com/insurecrm/email/model/EmailRequest.java
        concern: "EmailRequest DTO — @Schema annotations for request body spec"
      - file: java/src/main/java/com/insurecrm/email/model/EmailResponse.java
        concern: "EmailResponse DTO — @Schema annotations for response spec"
      - file: java/src/main/java/com/insurecrm/email/model/ReceivedEmail.java
        concern: "ReceivedEmail model — @Schema annotations for inbox response spec"

# ─────────────────────────────────────────────
# OpenAPI Specs
# ─────────────────────────────────────────────
specs:

  - spec: docs/docs/specs/express-openapi.json
    generator: scripts/generate-openapi-specs.sh
    sources:
      - file: javascript/src/routes/auth.ts
        concern: "Auth endpoints — JSDoc @openapi annotations define the spec"
      - file: javascript/src/routes/clients.ts
        concern: "Client endpoints — JSDoc @openapi annotations define the spec"
      - file: javascript/src/routes/coi.ts
        concern: "COI endpoints — JSDoc @openapi annotations define the spec"
      - file: javascript/src/types/auth.ts
        concern: "Auth request/response types referenced by OpenAPI schemas"
      - file: javascript/src/types/client.ts
        concern: "Client/Policy types referenced by OpenAPI schemas"
      - file: javascript/src/types/coi.ts
        concern: "COI types referenced by OpenAPI schemas"

  - spec: docs/docs/specs/springboot-openapi.json
    generator: scripts/generate-openapi-specs.sh
    sources:
      - file: java/src/main/java/com/insurecrm/email/controller/SendEmailController.java
        concern: "Send Email endpoints — @Operation/@ApiResponse Swagger annotations"
      - file: java/src/main/java/com/insurecrm/email/controller/ReceiveEmailController.java
        concern: "Receive Email endpoints — @Operation/@Tag Swagger annotations"
      - file: java/src/main/java/com/insurecrm/email/model/EmailRequest.java
        concern: "EmailRequest DTO — @Schema annotations for request body spec"
      - file: java/src/main/java/com/insurecrm/email/model/EmailResponse.java
        concern: "EmailResponse DTO — @Schema annotations for response spec"
      - file: java/src/main/java/com/insurecrm/email/model/ReceivedEmail.java
        concern: "ReceivedEmail model — @Schema annotations for inbox response spec"

# ─────────────────────────────────────────────
# MkDocs Config
# ─────────────────────────────────────────────
# When a new doc page is added, it must also be registered in mkdocs.yml nav.
mkdocs_config: docs/mkdocs.yml
