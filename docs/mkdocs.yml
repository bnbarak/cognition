site_name: InsureCRM Documentation
site_description: Documentation for InsureCRM — a CRM platform for insurance agencies
site_url: https://insurecrm.example.com/docs

theme:
  name: shadcn

plugins:
  - search
  - neoteroi.mkdocsoad:
      use_pymdownx: true

nav:
  - Home: index.md
  - Product Overview: product.md
  - Authentication: authentication.md
  - API Reference:
      - Core API (TypeScript): api/core-api.md
      - Claims API (TypeScript): api/claims-controller.md
      - Email API (Java): api/email-api.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
