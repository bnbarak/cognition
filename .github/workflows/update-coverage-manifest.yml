name: Update Coverage Manifest

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  update-manifest:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'Test Coverage')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: javascript
        run: npm install

      - name: Run coverage
        working-directory: javascript
        run: npm run coverage -- --reporter=json-summary --reporter=text

      - name: Update manifest
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { execSync } = require("child_process");

            const manifestPath = "tests/coverage-manifest.json";
            const summaryPath = "javascript/coverage/coverage-summary.json";

            if (!fs.existsSync(summaryPath)) {
              core.setFailed(`coverage-summary.json not found at ${summaryPath}`);
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));

            const prFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(process.env.PR_NUMBER),
                per_page: 100,
              }
            );

            const testFilesInPr = prFiles
              .map((f) => f.filename)
              .filter((f) => f.startsWith("tests/javascript/") && f.endsWith(".test.ts"));

            function tierFor(testPath) {
              const content = fs.readFileSync(testPath, "utf8");
              if (/HARD 2/i.test(content)) return "hard2";
              if (/HARD 1/i.test(content)) return "hard1";
              return "easy";
            }

            function productionFileForTest(testPath) {
              // tests/javascript/<sub>/<name>.test.ts -> javascript/src/<sub>/<name>.ts
              const rel = testPath.replace(/^tests\/javascript\//, "").replace(/\.test\.ts$/, ".ts");
              return `javascript/src/${rel}`;
            }

            for (const testFile of testFilesInPr) {
              const prodFile = productionFileForTest(testFile);
              const absProd = path.resolve(prodFile);
              const summaryEntry = summary[absProd];
              if (!summaryEntry) {
                core.warning(`no coverage entry for ${prodFile}`);
                continue;
              }
              const commit = execSync(`git log -n 1 --pretty=%H -- "${prodFile}"`).toString().trim();
              const date = execSync(`git log -n 1 --pretty=%cI -- "${prodFile}"`).toString().trim();

              const entry = {
                file: prodFile,
                test_file: testFile,
                tier: tierFor(testFile),
                last_tested_commit: commit,
                last_tested_date: new Date(date).toISOString(),
                coverage_after: summaryEntry.statements.pct,
                pr: process.env.PR_URL,
              };

              const idx = manifest.files.findIndex((e) => e.file === prodFile);
              if (idx >= 0) manifest.files[idx] = entry;
              else manifest.files.push(entry);
            }

            manifest.files.sort((a, b) => a.file.localeCompare(b.file));
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");

            const diff = execSync(`git diff --quiet ${manifestPath} || echo changed`).toString().trim();
            if (diff !== "changed") {
              core.info("manifest unchanged");
              return;
            }

            execSync(`git config user.name "github-actions[bot]"`);
            execSync(`git config user.email "41898282+github-actions[bot]@users.noreply.github.com"`);
            execSync(`git add ${manifestPath}`);
            execSync(`git commit -m "chore(coverage): update manifest from PR #${process.env.PR_NUMBER}"`);
            execSync(`git push origin main`);
